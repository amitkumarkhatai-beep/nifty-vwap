name: CAS Signal Engine

on:
  workflow_dispatch:

  schedule:
    # 2:58 PM IST = 09:28 UTC
    # Monday to Friday
    - cron: "28 9 * * 1-5"

jobs:
  cas:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run CAS engine
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "1001276343"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python cas_engine.py

      - name: Save calibration data
        run: |
          git config user.name "CAS Signal Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ || true

          if ! git diff --cached --quiet; then
            git commit -m "Update CAS calibration data"
            git push
          else
            echo "No calibration changes to commit"
          fi
